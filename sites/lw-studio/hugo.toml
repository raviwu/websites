baseURL = "https://lwstudio.org/"
locale = "zh-hant-tw"
defaultContentLanguage = "zh-hant-tw"
title = "LW Studio"
hasCJKLanguage = true

[pagination]
  pagerSize = 20

[module]
  [[module.imports]]
    path = "github.com/CaiJimmy/hugo-theme-stack/v4"

[params]
  mainSections = ["posts"]
  favicon = "favicon.ico"
  description = "經濟學、哲學、翻譯"

  [params.sidebar]
    emoji = ""
    subtitle = "經濟學 · 哲學 · 翻譯"

  [params.article]
    math = false
    toc = true
    readingTime = true

    [params.article.license]
      enabled = false

  [[params.widgets.homepage]]
    type = "search"
  [[params.widgets.homepage]]
    type = "archives"
  [[params.widgets.homepage]]
    type = "tag-cloud"
  [[params.widgets.page]]
    type = "toc"

  # v4 default :date_full adds the weekday, which wraps in narrow cards
  [params.dateFormat]
    published = ":date_long"
    lastUpdated = ":date_long"

  [params.colorScheme]
    toggle = true
    default = "dark"

[taxonomies]
  tag = "tags"
  category = "categories"

[menu]
  [[menu.main]]
    identifier = "home"
    name = "首頁"
    url = "/"
    weight = 1
  [[menu.main]]
    identifier = "tags"
    name = "標籤"
    url = "/tags/"
    weight = 2

[outputs]
  home = ["HTML", "RSS"]

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true
